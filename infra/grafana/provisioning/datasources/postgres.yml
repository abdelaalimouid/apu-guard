apiVersion: 1
datasources:
  - name: APU Postgres
    uid: apu-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana
    isDefault: true
    jsonData:
      database: apu
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: grafana
