[project]
name = "apu-guard"
version = "0.1.0"
description = "A system that watches the air compressor of a Porto metro train, warns before it fails, and keeps itself up to date without going blind."
readme = "README.md"
authors = [
    { name = "abdelaalimouid", email = "124872587+abdelaalimouid@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.1",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
