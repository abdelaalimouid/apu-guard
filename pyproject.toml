[project]
name = "apu-guard"
version = "0.1.0"
description = "Streaming failure detection for a metro air compressor: Kafka, Spark, MLflow, Airflow and Argo CD on MetroPT-3."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "abdelaalimouid", email = "124872587+abdelaalimouid@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.164.0",
    "httpx2>=2.16.2",
    "psycopg2-binary>=2.9.13",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
notebook = [
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
